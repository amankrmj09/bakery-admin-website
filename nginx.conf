server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend gateway
    location /api/ {
        proxy_pass http://bakery-api.blubug.me/api/;
        proxy_set_header Host bakery-api.blubug.me;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # This is the MAGIC block that fixes the 404 Deep Linking error!
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (CSS, JS, Images) for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
